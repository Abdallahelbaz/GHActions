on:
  workflow_dispatch:

jobs:
  job_1:
    runs-on: ubuntu-latest
    steps:
      - run: |
          "echo Job ${{ github.job }}"
          install pandas
      # to specify a dir for the project to work in
        working-directory: ./src
      # to specify shell to work on
        shell: bash

  job_2:
    runs-on: ubuntu-latest
    # this means job_1 must be finished before starting this one
    needs: job_1
    steps:
      - run: "echo Job ${{ github.job }}"

  job_3:
    runs-on: ubuntu-latest
    needs: job_1
    steps:
      - run: "echo Job ${{ github.job }}"

  job_4:
    runs-on: ubuntu-latest
    needs: [job_2, job_3]
    steps:
      - run: "echo Job ${{ github.job }}"
