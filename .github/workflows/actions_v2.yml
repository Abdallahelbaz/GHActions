on:
  workflow_dispatch:

jobs:
  hybrid_job:
    runs-on: ubuntu-latest
    steps:
      - name: Run a command in Ubuntu VM
        run: echo "This runs on the Ubuntu VM"
      # The image must be accessible without authentication
      - name: Run inside an Alpine container
        uses: docker://alpine:3.14 
        with:
          entrypoint: /bin/sh
          args: |
            -c "echo 'This step runs inside an Alpine container'"

      - name: Run another command in Ubuntu VM
        run: echo "Back to the VM"
    # if i want to use a private image with username and password, in this case
    # i can't use it in a step, it should be so:
    
  dockerized_job:
    runs-on: ubuntu-latest
    container: image_name
    # any step here will run inside the container
    steps:
      - run: python -v
      - run: echo "this runs inside docker container"
      
  # here with username and password
  dockerized_job_v2:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/my-org/my-private-image:latest
      credentials:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}
    steps:
      - run: node --version
      - run: echo "This whole job runs inside a Node.js container"

    
